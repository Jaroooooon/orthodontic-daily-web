name: 正畸行业简报网页自动更新

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
      timezone: 'Asia/Shanghai'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: orthodontic-daily-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    timeout-minutes: 20
    steps:
      - name: 获取仓库代码
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 一次检索、生成网页与同源微信正文
        run: python daily.py

      - name: 保存网页、历史归档及本次微信正文
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html archive.html archive/ .nojekyll digest-message.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish orthodontic daily brief'
            git push
          fi

      - name: 仅打包对外网页内容
        run: |
          mkdir -p _site
          cp index.html archive.html .nojekyll _site/
          cp -R archive _site/

      - name: 上传本期网页文件
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: 确认 GitHub Pages 部署成功
        id: deploy
        uses: actions/deploy-pages@v4

      - name: 部署完成后仅推送一条微信通知
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python daily.py --notify-only
